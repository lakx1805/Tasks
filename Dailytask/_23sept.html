<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Registration Form</title>
</head>
<body>

    <h2> Student Registration Form</h2>
    <form>

        <!--Student Name-->
         <label for="01" for="name">Name: <font color="red">*</font></label>
        <input type="text" id="01" placeholder="Enter Your Name"  pattern="[A-Za-z ]+" required>
        <br>
        <br>
        <!--Phone -->

        <label  for="02" for="phone no">PhoneNo.</label>
        <input type="number" id="02" placeholder="Enter Your Phone No">
         <br><br>
        <!--Email-->
        <label for="email id">Email Id<font color="red">*</font></label>
        <input type="email" name="email id" id="email id" placeholder="example@gmail.com"  required>
        <br>
        <br>
        <!--DOB-->
        <label for="DOB">DOB:</label>
        <input type="date" name="dob" id="dob" placeholder="Enter Your Dob">
        <br>
        <br>
        <!--COurse-->
        <label for="course">Course <font color="red" >*</font></label>
        <select name="course" id="course" required>  
            <option value="">--Select Course--</option>
            <option value="Bca">BCA</option>
            <option value="btech">B.Tech</option>
            <option value="mca">MCA</option>
            <option value="mba">MBA</option>
            <option value="phd">PHD</option>

        </select>
        <br><br>

        <!--Gender-->
        <label for="0001">Gender:
            <br><br>
        <input type="radio" name="gender" value="Male" id="0001" required>Male
        </label>
        <label for="0002">
        <input type="radio" name="gender" value="Female" id="0002" >Female
        </label>
        <label for="0003">
        <input type="radio" name="gender" value="Other" id="0003" >Other
        </label>

       <br><br>
  
       <!--Blood Group-->
       <label for="blood group">Blood Group: <font color="red">*</font></label>
       <br> <br>
       <label for="001">
       <input type="radio" id="001" value="o-" name="bloodgroup">O-
       </label>
       <label for="002">
       <input type="radio" id="002" value="o+" name="bloodgroup">O+
       </label>
       <label for="003">
       <input type="radio" id="003" value="o+" name="bloodgroup">other
       </label>
    
        <br><br>
        <!-----------|State----------->

        <label for="">State</label>
        <select name="" id=""> 
            
            
            <option value="">Delhi</option>
            <option value="">Haryana</option>
            <option value="">Himachal Pardesh</option>
            <option value="">Jammu and Kashmir</option>
            <option value="">Rajasthan</option>
            <option value="">Uttar Pardesh</option>
            <option value="">Uttra Khand</option>


        </select>
        <br><br>
        <!--city-->
        <label for="city">City</label>
        <input type="text" id="city" name="city" placeholder="Enter your city" required> 
        <br><br>
        <!--Address-->
        <label for="address">Address:</label>
        <textarea name="address" id="address" rows="3" cols="30" placeholder="enter your complete address"></textarea>

        <br><br>




        <!--Hobbies---------------->
         <label for="">Hobbies:</label>
         <input type="checkbox" name="hobby" value="Cricket">Cricket
         <input type="checkbox" name="hobby" value="Travel">Travel
         <input type="checkbox" name="hobby" value="Music">Music
         <input type="checkbox" name="hobby" value="Coding">Coding
        <br><br>


        <!--Photo-->
        <label for="photo">Upload Photo</label>
        <input type="file" name="photo" id="photo" accept="image/*">
        <br><br>

        <!--Term and Condition-->
        <input type="checkbox" name="" id="terms"  required">
        labe;<label for="terms">I agree to the Term & Conditions</label>
        <br><br>

        <input type="reset" value="Reset">
         <input type="submit" value="Register">
       

    </form>
    
</body>
</html>
